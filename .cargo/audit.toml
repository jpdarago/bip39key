# cargo-audit configuration. CI runs `cargo audit --deny warnings`, so unsound,
# unmaintained and yanked advisories fail the build alongside vulnerabilities.
#
# `ignore` is deliberately empty. An advisory with a released fix inside our
# semver requirements should be fixed by bumping Cargo.lock, not silenced here:
# suppressing it keeps CI green while release binaries keep shipping the
# affected crate. Only an advisory with no available fix belongs in this list,
# and then only with a written reason for why it cannot affect bip39key.

[advisories]
ignore = []
