name: Build & Sign Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # A transient upload failure in one target must not cancel the other
      # four: finalize needs every target present in the same run.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            static: true
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            static: true
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            static: false
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            static: false
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            static: false
            archive_ext: zip

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for musl/static targets)
        if: matrix.static
        run: cargo install cross

      - name: Build binary
        run: |
          BIN_NAME=bip39key
          TARGET=${{ matrix.target }}
          if [[ "${{ matrix.static }}" == "true" ]]; then
            cross build --release --target=$TARGET
          else
            cargo build --release --target=$TARGET
          fi

      - name: Rename and compress binary
        run: |
          BIN_NAME=bip39key
          TARGET=${{ matrix.target }}
          ARCHIVE_EXT=${{ matrix.archive_ext }}
          mkdir -p dist

          if [[ "$ARCHIVE_EXT" == "zip" ]]; then
            cp target/$TARGET/release/$BIN_NAME.exe dist/${BIN_NAME}-$TARGET.exe
            powershell -Command "Compress-Archive -Path dist\\${BIN_NAME}-$TARGET.exe -DestinationPath dist\\${BIN_NAME}-$TARGET.zip"
          else
            cp target/$TARGET/release/$BIN_NAME dist/${BIN_NAME}-$TARGET
            tar -czf dist/${BIN_NAME}-$TARGET.tar.gz -C dist ${BIN_NAME}-$TARGET
          fi

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign archive
        run: |
          TARGET=${{ matrix.target }}
          ARCHIVE_EXT=${{ matrix.archive_ext }}
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --output dist/bip39key-$TARGET.$ARCHIVE_EXT.sig \
              --detach-sign dist/bip39key-$TARGET.$ARCHIVE_EXT
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload build artifact for finalize step
        uses: actions/upload-artifact@v4
        with:
          name: built-${{ matrix.target }}
          path: |
            dist/bip39key*

  finalize:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist from all jobs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten archives and signatures
        run: |
          mkdir -p final
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp {} final/ \;

      - name: Check every target built
        run: |
          cd final
          missing=0
          for name in \
              bip39key-x86_64-unknown-linux-musl.tar.gz \
              bip39key-aarch64-unknown-linux-musl.tar.gz \
              bip39key-x86_64-apple-darwin.tar.gz \
              bip39key-aarch64-apple-darwin.tar.gz \
              bip39key-x86_64-pc-windows-msvc.zip; do
            for path in "$name" "$name.sig"; do
              if [ ! -f "$path" ]; then
                echo "MISSING $path"
                missing=1
              fi
            done
          done
          exit "$missing"

      - name: Generate SHA256SUMS
        run: |
          cd final
          sha256sum bip39key-* > SHA256SUMS

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Sign SHA256SUMS
        run: |
          cd final
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --output SHA256SUMS.sig \
              --detach-sign SHA256SUMS
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Every asset is published here, from a single job, one at a time.
      # GitHub answers concurrent asset uploads to the same release with
      # 500 "Error creating asset temp dir". softprops/action-gh-release
      # fires all its uploads at once, so it hit this even from one job; it
      # left v1.7.0 with 9 of 12 assets and v1.8.0 with 7, signatures
      # orphaned from missing archives. gh uploads one file per call, which
      # lets us serialize and retry.
      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd final
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "bip39key $TAG"
          fi
          for asset in bip39key-* SHA256SUMS SHA256SUMS.sig; do
            uploaded=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$asset" \
                   --repo "$GITHUB_REPOSITORY" --clobber; then
                echo "uploaded $asset"
                uploaded=1
                break
              fi
              echo "attempt $attempt for $asset failed; retrying"
              sleep $((attempt * 5))
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "FAILED to upload $asset after 5 attempts"
              exit 1
            fi
          done

      # A release missing an archive or a signature is worse than no release,
      # so confirm what actually landed rather than trusting the uploads.
      - name: Verify the published release is complete
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          published=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort)
          echo "$published"
          expected=$(cd final && ls bip39key-* SHA256SUMS SHA256SUMS.sig | sort)
          if [ "$published" != "$expected" ]; then
            echo "Published assets do not match what was built:"
            diff <(echo "$expected") <(echo "$published") || true
            exit 1
          fi
          echo "All $(echo "$expected" | wc -l) assets published."
