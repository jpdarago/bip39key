name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Advisories are published against dependencies that have not changed, so the
  # audit has to run on a clock rather than only when someone pushes.
  schedule:
    - cron: '17 6 * * *'

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        run: cargo check --locked

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    # Not on the daily schedule. check-version.sh compares Cargo.toml against
    # the latest tag, and a release deliberately leaves main mismatched between
    # the version bump and the tag push. A scheduled run landing in that window
    # fails every morning with a red X nobody can act on, which is how people
    # learn to ignore the job this schedule was added for.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: ./scripts/check-version.sh

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Fails on unsound, unmaintained and yanked advisories as well as
      # vulnerabilities. Plain `cargo audit` exits 0 on all but the last, so it
      # reported the anyhow and rand unsoundness advisories while staying green.
      # Deliberate exceptions belong in audit.toml with a written reason.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  deny:
    name: Licenses, Bans and Sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Advisories are covered by the audit job above; this covers the things
      # cargo-audit cannot see: license terms, duplicate versions, and crates
      # pulled from anywhere other than crates.io.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  tests:
    strategy:
      matrix:
        # TODO: Add windows once GPG issue is fixed.
        os: [ubuntu-latest, macos-latest]
    name: Tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit and integration tests
        run: cargo test --locked --release
