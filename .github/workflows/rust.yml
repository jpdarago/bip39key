name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Advisories are published against dependencies that have not changed, so the
  # audit has to run on a clock rather than only when someone pushes.
  schedule:
    - cron: '17 6 * * *'

env:
  CARGO_TERM_COLOR: always

# Least privilege by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        run: cargo check --locked

      # build.rs regenerates the README usage block, the manpage and the shell
      # completions from src/cli.rs. If the build just changed any of them, the
      # committed copy is stale: build locally and commit the result.
      - name: Check generated files are up to date
        run: git diff --exit-code -- README.md man completions

  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    # Not on the daily schedule. check-version.sh compares Cargo.toml against
    # the latest tag, and a release deliberately leaves main mismatched between
    # the version bump and the tag push. A scheduled run landing in that window
    # fails every morning with a red X nobody can act on, which is how people
    # learn to ignore the job this schedule was added for.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: ./scripts/check-version.sh

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Fails on unsound, unmaintained and yanked advisories as well as
      # vulnerabilities. Plain `cargo audit` exits 0 on all but the last, so it
      # reported the anyhow and rand unsoundness advisories while staying green.
      # Deliberate exceptions belong in audit.toml with a written reason.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit --deny warnings

  deny:
    name: Licenses, Bans and Sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # Advisories are covered by the audit job above; this covers the things
      # cargo-audit cannot see: license terms, duplicate versions, and crates
      # pulled from anywhere other than crates.io.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  deb:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # The release builds this target with cross; plain cargo is enough for
      # x86_64 and is what a tag push would package.
      - name: Build the static binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Build the package twice
        run: |
          binary=target/x86_64-unknown-linux-musl/release/bip39key
          scripts/build-deb.sh "$binary" amd64 deb
          scripts/build-deb.sh "$binary" amd64 deb-again

      - name: Check the package is reproducible
        run: cmp deb/*.deb deb-again/*.deb

      # The binary must be static: a dynamic one would need a Depends line
      # the package does not have.
      - name: Check the binary is statically linked
        run: |
          file target/x86_64-unknown-linux-musl/release/bip39key | tee /dev/stderr \
            | grep -Eq 'static(ally|-pie) linked'

      - name: Install and run it
        run: |
          sudo dpkg -i deb/*.deb
          version=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          test "$(/usr/bin/bip39key --version)" = "bip39key $version"
          test "$(dpkg-query -W -f='${Version}' bip39key)" = "$version"
          man -w bip39key
          test -f /usr/share/bash-completion/completions/bip39key
          test -f /usr/share/zsh/vendor-completions/_bip39key
          sudo dpkg -r bip39key
          test ! -e /usr/bin/bip39key

  tests:
    strategy:
      # One OS failing must not cancel the other: GPG differs per runner, and
      # seeing whether a failure is platform-specific is the first question.
      fail-fast: false
      matrix:
        # TODO: Add windows once GPG issue is fixed.
        #
        # Pinned to 24.04: ubuntu-latest moved to 26.04, which ships
        # libgcrypt 1.12.0. Its key check wrongly rejects about half of all
        # valid Curve25519 secret keys (upstream T8094, fixed in 1.12.1), so
        # gpg-agent fails to decrypt with some of our test keys ("Bad secret
        # key"). Upstream 1.11.3, 1.12.1 and 1.12.4 all decrypt with the same
        # keys. See "Known issues" in README.md. Move back once 26.04 ships
        # libgcrypt >= 1.12.1.
        os: [ubuntu-24.04, macos-latest]
    name: Tests
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # GPG and ssh-keygen ship on both runner images; age does not. The
      # integration tests check age output against the real age binaries.
      - name: Install age (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install age (macOS)
        if: runner.os == 'macOS'
        run: brew install age

      - name: Run unit and integration tests
        run: cargo test --locked --release
